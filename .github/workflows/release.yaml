name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create package
        run: |
          tar -czf system-utilities-cli-${GITHUB_REF_NAME}.tar.gz \
            app.py \
            README.md \
            LICENSE \
            scripts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: system-utilities-cli-${{ github.ref_name }}.tar.gz